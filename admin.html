<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Bookings · Lee's Beauty Studio</title>
  <meta name="theme-color" content="#1f1714" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231f1714'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='%23d9b99b' font-family='Georgia,serif' font-style='italic'>L</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin">
  <header class="admin-bar">
    <a class="admin-logo" href="./">Lee's <em>Beauty Studio</em></a>
    <button class="btn btn-ghost btn-small" id="signOut" hidden>Sign out</button>
  </header>

  <main class="admin-main">
    <p class="admin-msg" id="msg" role="status">Loading…</p>

    <!-- Sign in -->
    <form class="booking admin-card" id="login" hidden novalidate>
      <h1>Your bookings</h1>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <p class="form-error" id="loginError" role="alert"></p>
      <button class="btn btn-block" type="submit">Sign in</button>
      <button class="link-btn" type="button" id="forgot">Forgot your password?</button>
    </form>

    <!-- Signed in -->
    <div id="panel" hidden>
      <section class="admin-section">
        <div class="admin-head">
          <h1>Upcoming</h1>
          <p class="admin-count" id="count"></p>
        </div>
        <div class="notice" id="notice" role="status" tabindex="-1" hidden></div>
        <div id="list" aria-live="polite"></div>
      </section>

      <section class="admin-section admin-card booking">
        <h2>Block time off</h2>
        <p class="admin-hint">For walk-ins, days off or anything that isn't an online booking. Blocked times disappear from the website.</p>
        <div class="field">
          <label for="blockDate">Day</label>
          <input type="date" id="blockDate" />
        </div>
        <fieldset class="field">
          <legend>Times</legend>
          <div class="slot-grid" id="blockSlots"><p class="slots-note">Pick a day first.</p></div>
        </fieldset>
        <p class="form-error" id="blockError" role="alert"></p>
        <div class="admin-actions">
          <button class="btn" type="button" id="blockSel">Block selected</button>
          <button class="btn btn-ghost" type="button" id="blockDay">Block whole day</button>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
